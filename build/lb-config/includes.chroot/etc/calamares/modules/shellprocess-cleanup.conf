# Aufraeumen im ZIELSYSTEM, nachdem alles kopiert und eingerichtet ist.
#
# ----------------------------------------------------------------------
# Warum es diesen Schritt braucht
#
# Das installierte System entsteht als 1:1-Kopie der Live-Sitzung (unpackfs
# kopiert die squashfs). Alles, was die Build-Hooks ins Dateisystem gelegt
# haben, ist danach auch auf der Platte - und zwar ohne Besitzer, weil kein
# Paket diese Dateien kennt. "apt remove calamares" raeumt sie also nicht mit
# weg.
#
# Genau das erzeugte ein totes Symbol: Hook 0040 schreibt den Menueeintrag
# viperos-installer.desktop mit "Exec=pkexec calamares", waehrend
# packages.conf calamares aus dem Zielsystem entfernt. Der Nutzer haette im
# Anwendungsmenue einen Eintrag "ViperOS installieren", der nichts tut.
#
# TryExec=calamares im Eintrag ist die erste Absicherung, aber die
# Spezifikation formuliert sie weich ("the entry may be ignored"). Hier wird
# die Datei deshalb wirklich geloescht.
#
# Laeuft mit dontChroot: false, also IM Zielsystem - die Pfade unten beziehen
# sich auf die frisch installierte Platte, nicht auf die Live-Sitzung.
# ----------------------------------------------------------------------
---
dontChroot: false
timeout: 60

script:
    # Der Installer-Menueeintrag. Auf einem installierten System gibt es
    # nichts mehr zu installieren, und calamares ist entfernt.
    - "-rm -f /usr/share/applications/viperos-installer.desktop"

    # Das Desktop-Symbol, falls ein aelteres Image es ueber /etc/skel in das
    # neue Konto vererbt hat. Hook 0040 legt es seit der Reparatur nur noch
    # ins Home des Live-Benutzers, aber ein Upgrade-Pfad von einem frueheren
    # ISO soll nicht mit einem toten Symbol enden.
    #
    # Das Sternchen deckt jedes Konto ab; Calamares legt genau eines an.
    - "-rm -f /home/*/Desktop/viperos-installer.desktop"
    - "-rm -f /etc/skel/Desktop/viperos-installer.desktop"

    # Der Autostart, der Desktop-Verknuepfungen als vertrauenswuerdig
    # markiert, wird nicht entfernt: er ist auch auf dem installierten System
    # nuetzlich (Nutzer legen eigene Verknuepfungen an) und schadet nicht,
    # wenn der Schreibtisch leer ist - das Skript steigt dann sofort aus.

    # Die motd nennt die Live-Zugangsdaten ("Live-Benutzer: viperos |
    # Passwort: viperos"). Auf der Platte gibt es diesen Zugang nicht mehr.
    #
    # Der Dienst aus Hook 0018 setzt die Datei beim Start ohnehin zurueck,
    # sobald der Live-Benutzer fehlt; hier passiert es sofort, damit schon
    # die allererste Anmeldung keine falschen Zugangsdaten zeigt.
    #
    # Kein "sh -c"-Wrapper: jeder Eintrag laeuft bereits in einer eigenen
    # Shell ("/bin/sh -c is invoked for each command"), Umleitung und
    # Verkettung funktionieren also direkt. Ein zusaetzlicher Wrapper
    # brauchte eine zweite Ebene Anfuehrungszeichen - genau die Art
    # Verschachtelung, die in diesem Projekt schon einmal einen Build
    # gekostet hat (Exit 127 durch ein gesprengtes Zitat).
    - "-grep -q Live-Benutzer /etc/motd && printf '\\n  ViperOS 2.0\\n\\n' > /etc/motd"

# ----------------------------------------------------------------------
# Zum fuehrenden "-": es macht den Befehl unkritisch, wie bei make.
# Dokumentiert als: "If a command starts with '-' ... then the return value
# of the command following the - is ignored." Ohne Minus gilt das Gegenteil,
# "a failing command will abort the installation".
#
# Hier ist das zwingend: "rm -f" auf eine fehlende Datei ist zwar
# folgenlos, aber das grep oben liefert 1, wenn die motd bereits in Ordnung
# ist - ohne Minus wuerde eine vollstaendig gelungene Installation genau
# daran im letzten Schritt scheitern.
#
# Hinweis fuer spaetere Aenderungen: "$" laesst sich hier nicht frei
# verwenden. Calamares ersetzt ${var} selbst und dokumentiert, dass ein
# ungeschuetztes "$" nicht erreichbar ist - Shell-Variablen und
# Kommandosubstitution funktionieren in diesen Zeilen also nicht.
# ----------------------------------------------------------------------
