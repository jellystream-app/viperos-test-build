# Entfernt das Live-Konto aus dem installierten System.
#
# Der Name MUSS mit dem Live-Benutzer uebereinstimmen. Der entsteht an zwei
# Stellen, die zusammenpassen muessen:
#   - Hook 0010 legt ihn im Chroot an (useradd ... viperos)
#   - auto/config meldet ihn per --bootappend-live an (username=viperos)
#
# Das Modul ruft "userdel" im Zielsystem auf. Findet es den Benutzer nicht,
# meldet es "Cannot remove user" und die Installation schlaegt fehl - ein
# falscher Name hier ist also nicht folgenlos.
---
username: viperos
