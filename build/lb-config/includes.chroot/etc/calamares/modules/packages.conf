# Pakete, die im ZIELSYSTEM nach dem Kopieren nicht mehr gebraucht werden.
#
# Wichtig zum Verstaendnis: das Modul arbeitet im Zielsystem
# (check_target_env_call), nicht in der laufenden Live-Sitzung. Die Helfer
# von calamares-settings-debian, die spaeter in der Sequenz noch gebraucht
# werden (sources-media-unmount, sources-final, dpkg-unsafe-io-undo), laufen
# dagegen in der LIVE-Sitzung und bleiben davon unberuehrt.
#
# Nach dem Entfernen laeuft "apt-get --purge autoremove" (siehe PMApt.remove
# in modules/packages/main.py). Das raeumt auch alles weg, was nur noch als
# Abhaengigkeit der entfernten Pakete dastand.
#
# Genau deshalb steht os-prober seit dieser Aenderung ausdruecklich in der
# Paketliste des Images: es ist ein hartes Depends von calamares und waere
# sonst als verwaiste Abhaengigkeit mit entfernt worden. grub-common fuehrt
# es nur als Recommends, holt es also nicht zurueck. Ohne os-prober findet
# ein spaeteres "update-grub" ein parallel installiertes Windows nicht mehr
# und traegt es nicht ins Bootmenue ein - der Rechner startet dann scheinbar
# nur noch ViperOS.
---
backend: apt

operations:
  - remove:
      # Live-Unterbau. Auf der Platte wuerde live-boot beim Start ein
      # Medium suchen, das es nicht mehr gibt.
      - 'live-boot'
      - 'live-boot-doc'
      - 'live-config'
      - 'live-config-doc'
      - 'live-config-systemd'
      - 'live-tools'
      - 'live-task-localisation'
      - 'live-task-recommended'
      # Der Installer selbst. Debian entfernt nur das Einstellungspaket und
      # ueberlaesst calamares dem autoremove; hier steht beides ausdruecklich
      # da, damit die Absicht im Code steht und nicht im Nebeneffekt.
      - 'calamares'
      - 'calamares-settings-debian'
