# Anmeldemanager im installierten System.
#
# Debians Fassung listet sieben Kandidaten (slim, sddm, lightdm, gdm, mdm,
# lxdm, kdm) und richtet ein, was es findet. ViperOS hat genau einen: GDM.
# Die kurze Liste ist damit nicht nur aufgeraeumter, sie verhindert auch,
# dass ein zufaellig mitinstallierter zweiter Manager die Anmeldung
# uebernimmt.
#
# Das Modul findet GDM ueber /etc/gdm3/daemon.conf (aus dem Paket gdm3) und
# benutzt dann den Namen "gdm3" - beides in modules/displaymanager/main.py
# nachgesehen (Kandidatenliste have_dm()).
---
displaymanagers:
  - gdm

# basicSetup legt Benutzer, Gruppe und /var-Verzeichnisse des Anmeldemanagers
# selbst an. Das erledigt in Debian die postinst von gdm3 - besser und
# vollstaendiger. Deshalb aus, wie bei Debian.
basicSetup: false

# Nur fuer openSUSE-Systeme mit /etc/sysconfig/displaymanager relevant.
sysconfigSetup: false
