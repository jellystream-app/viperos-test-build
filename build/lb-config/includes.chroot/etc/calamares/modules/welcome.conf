# Begruessungsseite und Voraussetzungspruefung des Installers.
---
showSupportUrl:         true
showKnownIssuesUrl:     false
showReleaseNotesUrl:    true

requirements:
    # ------------------------------------------------------------------
    # Platzbedarf
    #
    # Dieser Wert steht in "required" (unten) und VERHINDERT die
    # Installation, wenn die Platte kleiner ist. Er muss deshalb gemessen
    # sein, nicht geschaetzt - zu hoch angesetzt sperrt er Rechner aus, auf
    # denen ViperOS problemlos liefe.
    #
    # Gemessen ueber die aufgeloeste Paketliste (1791 Pakete, Summe der
    # Installed-Size aus dem Trixie-Index):
    #
    #   Debian-Pakete            4,15 GB
    #   VS Code + Jellystream  ~ 0,6  GB  (aus Hook 0015)
    #   ------------------------------
    #   Wurzeldateisystem      ~ 4,8  GB
    #
    # Bei 15 GB bleiben also rund 10 GB fuer Auslagerung, Journal,
    # Aktualisierungen und Nutzerdaten - ausreichend mit deutlichem Abstand.
    #
    # Eine fruehere Fassung dieser Datei setzte 25 GB mit der Begruendung,
    # ViperOS sei "deutlich groesser als Debian". Die Messung widerlegt das:
    # der Unterschied betraegt gut 2 GB, nicht 10. Der Wert haette jede
    # Installation auf einer 20-GB-Platte abgelehnt - und genau so gross
    # sind uebliche Test-VMs.
    #
    # Zu niedrig waere umgekehrt auch gefaehrlich: laeuft die Platte
    # waehrend "unpackfs" voll, ist das nach dem Partitionieren - die alte
    # Installation ist dann schon weg und die neue unbrauchbar. 15 GB haelt
    # zu den gemessenen 4,8 GB genug Abstand.
    requiredStorage:    15

    # 1 GB ist die Untergrenze, unter der GNOME Shell nicht sinnvoll laeuft.
    requiredRam:        1.0

    check:
        - storage
        - ram
        - power
        - internet
        - root

    # Nur diese drei verhindern die Installation. Netz und Netzteil werden
    # geprueft und angezeigt, blockieren aber nicht: ViperOS installiert
    # vollstaendig vom Medium und braucht dafuer keine Verbindung.
    required:
        - storage
        - ram
        - root
