# Begruessungsseite und Voraussetzungspruefung des Installers.
---
showSupportUrl:         true
showKnownIssuesUrl:     false
showReleaseNotesUrl:    true

requirements:
    # ------------------------------------------------------------------
    # Platzbedarf
    #
    # Debian setzt hier 15 GB. Das ist fuer ViperOS zu knapp: das Image
    # bringt neben GNOME auch LibreOffice, GIMP, Inkscape, OBS, VS Code und
    # Jellystream mit. Die ISO allein liegt bei ~2,8 GB, entpackt deutlich
    # darueber - dazu kommen Auslagerung, Journal und der Platz, den ein
    # System zum Arbeiten braucht.
    #
    # Zu niedrig angesetzt laeuft die Platte waehrend "unpackfs" voll, also
    # mitten im Kopieren und nach dem Partitionieren. Dann ist die alte
    # Installation bereits weg und die neue unbrauchbar.
    requiredStorage:    25

    # 1 GB ist die Untergrenze, unter der GNOME Shell nicht sinnvoll laeuft.
    requiredRam:        1.0

    check:
        - storage
        - ram
        - power
        - internet
        - root

    # Nur diese drei verhindern die Installation. Netz und Netzteil werden
    # geprueft und angezeigt, blockieren aber nicht: ViperOS installiert
    # vollstaendig vom Medium und braucht dafuer keine Verbindung.
    required:
        - storage
        - ram
        - root
