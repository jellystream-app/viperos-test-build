# Konfiguration des ViperOS-Installers (Calamares)
# Syntax: YAML 1.2
#
# ----------------------------------------------------------------------
# Warum diese Datei existiert
#
# Bis hierher benutzte ViperOS die Konfiguration aus calamares-settings-debian
# unveraendert. Die funktioniert - fuer Debian. Zwei Dinge fehlten darin:
#
#   1. "removeuser" stand NICHT in der exec-Sequenz. Das Modul existiert
#      (libcalamares_job_removeuser.so, "Removing live user from the target
#      system"), wurde aber nie aufgerufen. Auf dem installierten System blieb
#      dadurch das Live-Konto mit bekanntem Passwort zurueck.
#
#   2. "branding: debian" - das eigene Branding aus Hook 0040 wurde nie
#      geladen.
#
# Diese Datei ersetzt Debians settings.conf ueber includes.chroot. Debians
# MODULE bleiben dagegen in Benutzung: sources-media, sources-final,
# bootloader-config und dpkg-unsafe-io kommen aus calamares-settings-debian
# und erledigen Arbeit, die ViperOS sonst selbst nachbauen muesste.
# ----------------------------------------------------------------------
---

modules-search: [ local, /usr/lib/calamares/modules ]

# ----------------------------------------------------------------------
# Benannte Modul-Instanz fuer den Aufraeumschritt
#
# Jedes Modul hat implizit eine Instanz mit seinem eigenen Namen und liest
# dann <modul>.conf. Soll ein Modul mit einer ANDEREN Konfiguration laufen,
# braucht es hier einen Eintrag - ein passend benannte Datei allein genuegt
# nicht, sie wuerde nie gelesen.
#
# In der Sequenz wird die Instanz als "modul@id" angesprochen, hier also
# shellprocess@cleanup.
# ----------------------------------------------------------------------
instances:
- id:     cleanup
  module: shellprocess
  config: shellprocess-cleanup.conf

oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false

sequence:
# Phase 1 - Abfrage. Hier sieht der Nutzer die Seiten des Installers.
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary

# Phase 2 - Ausfuehrung. Reihenfolge ist wichtig und entspricht Debians
# Ablauf; ergaenzt ist nur "removeuser" (siehe unten).
- exec:
  - partition
  - mount
  - unpackfs
  - luksbootkeyfile
  - dpkg-unsafe-io
  - sources-media
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  # ------------------------------------------------------------------
  # Das Live-Konto aus dem ZIELSYSTEM entfernen.
  #
  # Muss nach "users" stehen: erst wird das neue Konto des Nutzers
  # angelegt, dann das Live-Konto entfernt. Umgekehrt entfiele die
  # UID 1000 fuer den neuen Benutzer.
  #
  # Ohne diesen Eintrag ueberlebt "viperos" mit dem oeffentlich
  # dokumentierten Passwort die Installation. Der Dienst aus Hook 0018
  # raeumt die sudo-Ausnahme zwar auf, aber erst WENN der Benutzer weg
  # ist - er entfernt ihn nicht selbst.
  # ------------------------------------------------------------------
  - removeuser
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader-config
  - grubcfg
  - bootloader
  - packages
  - plymouthcfg
  - initramfscfg
  - initramfs
  - dpkg-unsafe-io-undo
  - sources-media-unmount
  - sources-final
  # ------------------------------------------------------------------
  # Aufraeumen im Zielsystem.
  #
  # MUSS nach "packages" stehen: erst dort wird calamares aus dem
  # Zielsystem entfernt, und dieser Schritt raeumt die Dateien weg, die
  # danach ins Leere zeigen - allen voran den Menueeintrag
  # viperos-installer.desktop, den Hook 0040 ins Dateisystem schreibt und
  # den kein Paket besitzt (also auch kein "apt remove" mitnimmt).
  #
  # Vor "umount": danach ist das Zielsystem nicht mehr eingehaengt.
  # ------------------------------------------------------------------
  - shellprocess@cleanup
  - umount

# Phase 3 - Abschluss.
- show:
  - finished

# Das Branding liegt in /usr/share/calamares/branding/viperos/.
branding: viperos

# Vor dem Schreiben auf die Platte nachfragen. Debian setzt das auf false;
# hier steht es bewusst auf true: der Schritt ist nicht umkehrbar, und die
# Partitionsseite laesst sich schnell falsch bedienen.
prompt-install: true

# Der Installer richtet ein Zielsystem ein, kein laufendes - also chroot.
dont-chroot: false
