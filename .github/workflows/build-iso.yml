name: Build ViperOS ISO

# Der Build laeuft auf GitHub-Runnern, nicht auf dem eigenen PC.
# Runner-Fakten, gegen die dieser Workflow ausgelegt ist (public repo):
#   4 vCPU, 16 GB RAM, 14 GB SSD, max. 6 h Job-Laufzeit.
# Gemessener Platzbedarf des Builds: ~9 GB Spitze (chroot 3.6 GB unpacked,
# 0.87 GB apt-Cache, squashfs ~1.5 GB, ISO ~1.8 GB). Das passt nur, wenn
# vorher das vorinstallierte Runner-Image aufgeraeumt wird - siehe "Free disk".

on:
  push:
    branches: [main]
    paths:
      - 'build/**'
      - 'scripts/build-iso.sh'
      - '.github/workflows/build-iso.yml'
  pull_request:
    paths:
      - 'build/**'
      - '.github/workflows/build-iso.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'ISO als GitHub-Release veroeffentlichen'
        type: boolean
        default: false
      version:
        description: 'Versions-Tag (z. B. 1.0). Leer = Lauf-Nummer'
        type: string
        default: ''

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Stufe 1: Preflight. Scheitert in ~2 Minuten statt nach 40 Minuten Build.
  # Prueft die Paketliste gegen Trixie, die Hook-Syntax und alle externen Hosts.
  # ---------------------------------------------------------------------------
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          # Bewusst OHNE live-build: Ubuntu liefert einen Fork (3.0~a57) mit
          # anderem Optionssatz als Debian (1:20250505). Ein "lb config"-Test
          # gegen das Ubuntu-Paket wuerde Optionen als unbekannt melden, die im
          # Trixie-Container voellig in Ordnung sind. Der lb-config-Test laeuft
          # deshalb weiter unten im echten debian:trixie-Container.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            debian-archive-keyring curl ca-certificates

      - name: CRLF check
        run: |
          # Ein einzelnes CR macht aus "ca-certificates" ein
          # "ca-certificates\r" -> apt meldet "Unable to locate package".
          # Nur das LETZTE Wort einer Zeile ist betroffen, daher sieht es so
          # aus, als waere genau dieses eine Paket kaputt.
          bad=0
          while IFS= read -r f; do
            if awk '/\r/{found=1} END{exit !found}' "$f"; then
              echo "::error file=$f::CRLF-Zeilenenden - muessen LF sein"
              bad=1
            fi
          done < <(find build/lb-config packages -type f \
                     \( -name '*.hook.chroot' -o -name '*.list.chroot' \
                        -o -name 'config' -o -name 'build' -o -name 'clean' \
                        -o -name 'control' -o -name 'changelog' -o -name 'rules' \
                        -o -name 'install' -o -name 'format' -o -name '*.sh' \
                        -o -path '*/usr/bin/*' -o -path '*/usr/lib/viperos/*' \) \
                     2>/dev/null)
          [ "$bad" -eq 0 ] && echo "Alle Dateien haben LF-Zeilenenden."
          exit "$bad"

      - name: Hook syntax check
        run: |
          # Ein unterminiertes Here-Doc erzeugt nur eine WARNUNG mit rc=0,
          # deshalb wird auch die Ausgabe geprueft, nicht nur der Exit-Code.
          bad=0
          for h in build/lb-config/hooks/live/*.hook.chroot; do
            [ -f "$h" ] || continue
            out=$(bash -n "$h" 2>&1); rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error file=$h::Syntaxfehler: $out"; bad=1
            elif [ -n "$out" ]; then
              echo "::error file=$h::Shell-Warnung: $out"; bad=1
            else
              echo "  OK  $h"
            fi
          done
          exit "$bad"

      - name: Validate ViperOS packages
        run: |
          # Seit V2 liegt die ViperOS-Identitaet in packages/ als echte
          # Debian-Pakete. Diese Pruefungen brauchen keinen Paketbau und
          # fangen die Fehler ab, die sonst erst im Container auffallen.
          bad=0

          for pkg in packages/*/; do
            [ -d "$pkg/debian" ] || continue
            name=$(basename "$pkg")
            echo "--- $name"

            # Pflichtdateien. Fehlt eine, scheitert dpkg-buildpackage mit
            # einer Meldung, die nicht auf die Ursache zeigt.
            for f in debian/control debian/changelog debian/rules; do
              [ -f "$pkg$f" ] || { echo "::error::$name: $f fehlt"; bad=1; }
            done

            # debian/rules MUSS ausfuehrbar sein, alle anderen debian/-Dateien
            # duerfen es NICHT: debhelper fuehrt eine ausfuehrbare Config als
            # Programm aus, statt sie zu lesen. Bei debian/install endete der
            # Bau dadurch mit "exit code 127".
            #
            # Geprueft wird der Modus im GIT-INDEX, nicht im Dateisystem. Auf
            # einem Windows-Arbeitsplatz meldet der Treiber fuer jede Datei
            # 0755, eine Dateisystem-Pruefung wuerde dort also alles
            # anschlagen. Git speichert nur 100644 oder 100755 - das ist der
            # Wert, den auch der Runner auscheckt.
            # Ohne Index-Ausgabe waere die Pruefung wirkungslos und wuerde
            # still durchwinken - also erst pruefen, ob git ueberhaupt liefert.
            if ! git ls-files -s "$pkg/debian" | grep -q .; then
              echo "::error::$name: git ls-files liefert nichts fuer $pkg/debian"
              echo "  Sind die Dateien committet? Ohne Index keine Rechte-Pruefung."
              bad=1
            fi
            while IFS= read -r line; do
              mode=${line%% *}
              f=${line#*$'\t'}
              case "$(basename "$f")" in
                rules)
                  [ "$mode" = "100755" ] || {
                    echo "::error::$f ist im Git-Index nicht ausfuehrbar (Modus $mode)"
                    echo "  Beheben mit: git update-index --chmod=+x $f"
                    bad=1; }
                  continue ;;
                postinst|preinst|postrm|prerm)
                  [ "$mode" = "100755" ] || {
                    echo "::error::$f (Maintainer-Skript) muss ausfuehrbar sein"
                    bad=1; }
                  continue ;;
              esac
              if [ "$mode" = "100755" ]; then
                echo "::error::$f ist ausfuehrbar - debhelper wuerde es ausfuehren statt lesen"
                echo "  Beheben mit: git update-index --chmod=-x $f"
                bad=1
              fi
            done < <(git ls-files -s "$pkg/debian")

            # Version in changelog und Paketname in control muessen passen.
            cname=$(sed -n 's/^Package: *//p' "$pkg/debian/control" | head -1)
            lname=$(sed -n '1s/^\([^ ]*\).*/\1/p' "$pkg/debian/changelog")
            if [ "$cname" != "$lname" ]; then
              echo "::error::$name: control nennt '$cname', changelog '$lname'"
              bad=1
            else
              ver=$(sed -n '1s/.*(\([^)]*\)).*/\1/p' "$pkg/debian/changelog")
              echo "      $cname $ver"
            fi
          done

          # Python-Syntax der mitgelieferten Programme. Der Hub war bis V1 ein
          # Here-Doc im Hook und liess sich nur durch einen ISO-Bau pruefen.
          while IFS= read -r f; do
            if head -1 "$f" | grep -q 'python3'; then
              if python3 -c "import ast,sys; ast.parse(open(sys.argv[1],encoding='utf-8').read())" "$f"; then
                echo "  OK  $f (Python)"
              else
                echo "::error file=$f::Python-Syntaxfehler"; bad=1
              fi
            elif head -1 "$f" | grep -qE '^#!/bin/(ba)?sh'; then
              out=$(bash -n "$f" 2>&1) && [ -z "$out" ] \
                && echo "  OK  $f (Shell)" \
                || { echo "::error file=$f::$out"; bad=1; }
            fi
          done < <(find packages -type f \( -path '*/usr/bin/*' \
                     -o -path '*/usr/lib/viperos/*' -o -name '*.sh' \) 2>/dev/null)

          # Der Hub darf keine XFCE-Werkzeuge mehr AUFRUFEN: ViperOS 2.0 laeuft
          # auf GNOME Shell, keines dieser Programme ist installiert. Geprueft
          # werden nur die Programmdateien, nicht debian/ - im Changelog stehen
          # die Namen zu Recht, dort ist dokumentiert, dass sie entfernt wurden.
          if find packages -type f \( -path '*/usr/bin/*' \
               -o -path '*/usr/lib/viperos/*' \) -print0 2>/dev/null \
             | xargs -0 -r grep -n 'xfce4-\|xfce-polkit'; then
            echo "::error::XFCE-Aufrufe in einem Paketprogramm - unter GNOME 48 nicht vorhanden"
            bad=1
          fi

          # /usr/local ist laut Debian Policy dem lokalen Administrator
          # vorbehalten; Paketdateien dort sind ein Policy-Verstoss.
          #
          # Das Muster hat KEINEN fuehrenden Slash: in debian/install stehen
          # Zielpfade immer relativ zum Wurzelverzeichnis ("usr/local/bin",
          # nicht "/usr/local/bin"). Ein Muster mit Slash traf deshalb nie zu -
          # der Check war wirkungslos, bis ein Negativtest es gezeigt hat.
          if grep -rnE '(^|[[:space:]])/?usr/local' packages/*/debian/install 2>/dev/null; then
            echo "::error::Paket installiert nach /usr/local - Policy-Verstoss"
            echo "  Paketdateien gehoeren nach /usr; /usr/local ist dem Administrator vorbehalten."
            bad=1
          fi

          exit "$bad"

      - name: Validate package list against Debian Trixie
        run: |
          # Gegen die ZIELdistribution pruefen, nicht gegen den Ubuntu-Runner.
          ROOT=$(mktemp -d)
          mkdir -p "$ROOT"/etc/apt/trusted.gpg.d "$ROOT"/var/lib/apt/lists/partial \
                   "$ROOT"/var/cache/apt/archives/partial "$ROOT"/var/lib/dpkg
          : > "$ROOT/var/lib/dpkg/status"
          cp /usr/share/keyrings/debian-archive-keyring.gpg "$ROOT/etc/apt/trusted.gpg.d/"
          # Kein eingeruecktes Here-Doc: die YAML-Einrueckung landet sonst mit
          # in der Datei und apt ignoriert die Zeilen.
          {
            echo 'deb https://deb.debian.org/debian trixie main contrib non-free non-free-firmware'
            echo 'deb https://deb.debian.org/debian trixie-updates main contrib non-free non-free-firmware'
            echo 'deb https://security.debian.org/debian-security trixie-security main contrib non-free non-free-firmware'
          } > "$ROOT/etc/apt/sources.list"

          APTO="-o Dir=$ROOT -o Dir::State=$ROOT/var/lib/apt
                -o Dir::State::status=$ROOT/var/lib/dpkg/status
                -o Dir::Cache=$ROOT/var/cache/apt
                -o Dir::Etc::sourcelist=$ROOT/etc/apt/sources.list
                -o Dir::Etc::sourceparts=$ROOT/etc/apt/sources.list.d
                -o Dir::Etc::trustedparts=$ROOT/etc/apt/trusted.gpg.d
                -o APT::Architecture=amd64 -o Acquire::Languages=none"

          apt-get $APTO update
          # Sanity-Gate: ohne geladenen Index wuerde JEDES Paket als fehlend
          # gemeldet werden - das Ergebnis waere wertlos.
          apt-cache $APTO show bash >/dev/null || {
            echo "::error::Trixie-Index leer, Pruefung nicht aussagekraeftig"; exit 1; }

          LIST=build/lb-config/package-lists/viperos-desktop.list.chroot
          missing=''
          while IFS= read -r line || [ -n "$line" ]; do
            p=$(printf '%s' "${line%%#*}" | tr -d '[:space:]')
            [ -z "$p" ] && continue
            apt-cache $APTO show "$p" >/dev/null 2>&1 || missing="$missing $p"
          done < "$LIST"
          if [ -n "$missing" ]; then
            echo "::error::Pakete fehlen in Trixie:$missing"; exit 1
          fi

          # Einzeln vorhanden reicht nicht - der Satz muss zusammen aufloesen.
          pkgs=$(sed 's/#.*//' "$LIST" | tr -d '[:blank:]' | grep -v '^$' | tr '\n' ' ')
          if ! apt-get $APTO install -y --dry-run --no-install-recommends $pkgs > /tmp/dry.txt 2>&1; then
            echo "::error::Paketsatz loest in Trixie nicht auf"
            grep -iE 'unmet|broken|conflict|^E:' /tmp/dry.txt | head -20
            exit 1
          fi
          n=$(grep -c '^Inst ' /tmp/dry.txt)
          echo "Paketliste OK - loest zu $n Paketen auf."
          echo "PKG_COUNT=$n" >> "$GITHUB_ENV"

      - name: Verify external build dependencies
        run: |
          # Diese Hosts braucht Hook 0015 waehrend des Builds. Sind sie nicht
          # erreichbar, bricht der Build unter "set -e" mitten im Chroot ab.
          bad=0
          for url in \
            https://deb.debian.org/debian/dists/trixie/InRelease \
            https://security.debian.org/debian-security/dists/trixie-security/InRelease \
            https://packages.microsoft.com/keys/microsoft.asc \
            https://packages.microsoft.com/repos/code/dists/stable/InRelease \
            https://dl.flathub.org/repo/flathub.flatpakrepo ; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$url" || echo 000)
            echo "  HTTP $code  $url"
            [ "$code" = "200" ] || { echo "::error::$url nicht erreichbar (HTTP $code)"; bad=1; }
          done
          exit "$bad"

      - name: Verify pinned Jellystream checksum
        run: |
          # Hook 0015 vergleicht diese SHA-512 mit "cmp" unter "set -e".
          # Stimmt sie nicht, stirbt der Build nach ~40 Minuten. Also vorher.
          V=2.14.0
          DEB="Jellystream-${V}-amd64.deb"
          curl -fL --retry 3 --proto '=https' --max-time 600 -o "/tmp/$DEB" \
            "https://github.com/jellystream-app/jellystream/releases/download/v${V}/${DEB}"
          printf '%s' 'LVQSTLE5sdx7aQvq3x7r2joNG95P459dvRDp9XwWtgtZzyLK7hpm7QUxktdLj2kOacM6Z3ki3sJpjuHZFsx9zw==' \
            | base64 -d > /tmp/expected
          openssl dgst -sha512 -binary "/tmp/$DEB" > /tmp/actual
          if cmp -s /tmp/expected /tmp/actual; then
            echo "Jellystream SHA-512 stimmt."
          else
            echo "::error::Jellystream SHA-512 abweichend - Hook 0015 wuerde den Build abbrechen."
            echo "Erwartet (base64): LVQSTLE5sdx7aQvq3x7r2joNG95P459dvRDp9XwWtgtZzyLK7hpm7QUxktdLj2kOacM6Z3ki3sJpjuHZFsx9zw=="
            echo "Tatsaechlich:      $(openssl dgst -sha512 -binary "/tmp/$DEB" | base64 -w0)"
            exit 1
          fi

      - name: lb config dry run (in debian:trixie)
        run: |
          # MUSS im Trixie-Container laufen, nicht auf dem Ubuntu-Runner:
          # Ubuntus live-build ist ein Fork (3.0~a57) und kennt --bootloaders,
          # --uefi-secure-boot, --image-name und
          # --chroot-squashfs-compression-type nicht. Debians live-build
          # (1:20250505) kennt sie - und genau das baut spaeter die ISO.
          docker run --rm -v "$PWD:/src:ro" -e DEBIAN_FRONTEND=noninteractive \
            debian:trixie bash -euo pipefail -c '
              apt-get update -qq
              apt-get install -y --no-install-recommends live-build >/dev/null
              echo "live-build: $(dpkg-query -W -f="\${Version}" live-build)"

              T=$(mktemp -d)
              cp -a /src/build/lb-config/auto "$T/auto"
              chmod 0755 "$T/auto/config"
              ( cd "$T" && bash auto/config )

              # Nur regulaere Dateien lesen: config/ enthaelt auch
              # Unterverzeichnisse, bei denen grep "Is a directory" meldet und
              # mit Status 2 endet - unter "pipefail" bricht das den Job ab,
              # obwohl lb config erfolgreich war.
              { find "$T/config" -maxdepth 1 -type f -exec grep -hE \
                  "LB_DISTRIBUTION=|LB_UEFI_SECURE_BOOT|LB_IMAGE_TYPE|LB_BOOTLOADERS|LB_CHROOT_SQUASHFS_COMPRESSION_TYPE" \
                  {} + || true; } | sort -u

              # Die Basis muss Trixie sein, unabhaengig vom Runner-Image.
              grep -q "LB_DISTRIBUTION=\"trixie\"" "$T/config/bootstrap" \
                || { echo "::error::auto/config setzt nicht Trixie"; exit 1; }
              # Secure Boot muss wirklich aktiv sein, nicht nur uebergeben.
              grep -rq "LB_UEFI_SECURE_BOOT=\"enable\"" "$T"/config/ \
                || { echo "::error::Secure Boot nicht aktiviert"; exit 1; }
              echo "auto/config OK: Trixie + Secure Boot"
            '

      - name: Validate dconf settings
        run: |
          # Diese Pruefung fehlte und hat einen Fehler bis in ein gebootetes
          # ISO durchgelassen: "enabled-extensions=[]" ist fuer dconf ein
          # Typfehler ("unable to infer type"), wodurch die GANZE Datei
          # verworfen wird. Weil GDM seine Greeter-Datenbank per
          # ExecStartPre kompiliert, scheiterte damit der Dienststart -
          # sichtbar erst beim Booten als "Failed to start gdm.service".
          #
          # dconf compile meldet solche Fehler in Sekunden.
          sudo apt-get install -y --no-install-recommends dconf-cli >/dev/null

          bad=0
          T=$(mktemp -d)

          # Jeden dconf-Block aus den Hooks extrahieren und einzeln
          # kompilieren - so, wie das System es spaeter tut.
          python3 - "$T" <<'PYEOF'
          import re, sys, pathlib
          out = pathlib.Path(sys.argv[1])
          hooks = pathlib.Path('build/lb-config/hooks/live')
          blocks = [
              ('local',  r"cat > /etc/dconf/db/local\.d/00-viperos << 'EOF'\n(.*?)\nEOF"),
              ('gdm',    r"cat > /etc/gdm3/greeter\.dconf-defaults << 'EOF'\n(.*?)\nEOF"),
          ]
          found = 0
          for hook in sorted(hooks.glob('*.hook.chroot')):
              src = hook.read_text(encoding='utf-8')
              for name, pat in blocks:
                  m = re.search(pat, src, re.S)
                  if m:
                      d = out / name
                      d.mkdir(parents=True, exist_ok=True)
                      (d / '00-viperos').write_text(m.group(1), encoding='utf-8')
                      print(f"  {hook.name} -> {name} ({len(m.group(1).splitlines())} Zeilen)")
                      found += 1
          if not found:
              print("::warning::keine dconf-Bloecke gefunden")
          PYEOF

          for d in "$T"/*/; do
            [ -d "$d" ] || continue
            name=$(basename "$d")
            if dconf compile "$T/$name.db" "$d" 2>"$T/$name.err"; then
              echo "  OK       $name ($(stat -c%s "$T/$name.db") Bytes)"
            else
              echo "::error::dconf-Fehler in $name:"
              sed 's/^/    /' "$T/$name.err"
              bad=1
            fi
          done
          exit "$bad"

      - name: Validate shell theme
        run: |
          # Das Shell-Theme ERSETZT GNOMEs Stylesheet, es ergaenzt es nicht
          # (Main.setThemeStylesheet). Ein zu kleines Theme laesst darum
          # tausende Regeln weg und die Oberflaeche faellt auf
          # St-Voreinstellungen zurueck. Deshalb hier pruefen, dass die
          # Basis mitgeliefert wird und gross genug ist.
          T=build/lb-config/includes.chroot/usr/share/themes/ViperOS/gnome-shell
          base="$T/gnome-shell-base.css"
          over="$T/viperos-overrides.css"

          for f in "$base" "$over"; do
            [ -f "$f" ] || { echo "::error::$f fehlt"; exit 1; }
          done

          bsz=$(stat -c%s "$base")
          osz=$(stat -c%s "$over")
          echo "  Basis:           $bsz Bytes"
          echo "  Ueberschreibung: $osz Bytes"
          echo "  zusammen:        $((bsz + osz)) Bytes"

          # GNOMEs Standard-CSS ist ~175 KB. Liegt die Basis deutlich
          # darunter, wurde sie nicht vollstaendig extrahiert.
          if [ "$bsz" -lt 150000 ]; then
            echo "::error::Basis-CSS ist nur $bsz Bytes - unvollstaendig"
            exit 1
          fi

          # Klammern muessen ausgeglichen sein, sonst verwirft St die Datei.
          python3 - "$over" <<'PYEOF'
          import sys, pathlib
          css = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8')
          if css.count('{') != css.count('}'):
              print(f"::error::CSS-Klammern unausgeglichen: {css.count('{')} vs {css.count('}')}")
              sys.exit(1)
          print(f"  {css.count('{')} Regeln, Klammern ausgeglichen")
          PYEOF

      - name: Summary
        run: |
          {
            echo "### Preflight bestanden"
            echo ""
            echo "| Pruefung | Ergebnis |"
            echo "|---|---|"
            echo "| Zeilenenden | LF, kein CR |"
            echo "| Hook-Syntax | alle Hooks OK |"
            echo "| Paketliste (Trixie) | loest zu ${PKG_COUNT} Paketen auf |"
            echo "| dconf-Vorgaben | kompilieren fehlerfrei |"
            echo "| Shell-Theme | Basis vorhanden, CSS gueltig |"
            echo "| Externe Hosts | alle HTTP 200 |"
            echo "| Jellystream SHA-512 | stimmt |"
            echo "| Basis | Debian 13 Trixie |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Stufe 2: Der eigentliche ISO-Build in einem Trixie-Container.
  # live-build braucht echte Kernel-Features (chroot, mount, mknod), deshalb
  # laeuft der Container privilegiert.
  # ---------------------------------------------------------------------------
  build:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 300   # Limit des Runners ist 360; 300 laesst Luft zum Aufraeumen
    outputs:
      iso-name:   ${{ steps.result.outputs.iso-name }}
      iso-size:   ${{ steps.result.outputs.iso-size }}
      iso-sha256: ${{ steps.result.outputs.iso-sha256 }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          # Der Runner hat nur 14 GB, der Build braucht ~9 GB Spitze.
          # Das vorinstallierte Image belegt mehrere GB, die hier weichen.
          echo "Vorher:"; df -h / | tail -1
          sudo rm -rf \
            /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/graalvm /usr/local/.ghcup \
            /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          sudo apt-get clean
          echo "Nachher:"; df -h / | tail -1

      - name: Build ISO in Debian Trixie container
        run: |
          set -euo pipefail
          mkdir -p output
          # --privileged: debootstrap braucht mknod, live-build braucht mount.
          docker run --rm --privileged \
            -v "$PWD:/src:ro" \
            -v "$PWD/output:/output" \
            -e DEBIAN_FRONTEND=noninteractive \
            debian:trixie \
            bash -euo pipefail -c '
              apt-get update -qq
              apt-get install -y --no-install-recommends \
                live-build debootstrap squashfs-tools zstd xorriso \
                isolinux syslinux-common grub-efi-amd64-bin grub-pc-bin \
                grub2-common mtools dosfstools rsync wget curl git \
                python3 ca-certificates

              # apt gegen Aussetzer des Debian-CDN absichern. Ein einzelner
              # Verbindungsabbruch beim Holen eines von ~1700 Paketen liess den
              # Build sonst nach 25 Minuten sterben ("Broken pipe" beim
              # Herunterladen, obwohl die Datei erreichbar ist).
              # Zeilenweise statt Here-Doc: ein Here-Doc muesste hier auf
              # Spalte 0 stehen und wuerde damit aus dem YAML-Block ausbrechen.
              {
                echo "Acquire::Retries \"10\";"
                echo "Acquire::Retries::Delay::Maximum \"30\";"
                echo "Acquire::http::Timeout \"120\";"
                echo "Acquire::https::Timeout \"120\";"
                echo "Acquire::http::Pipeline-Depth \"0\";"
                echo "Acquire::https::Pipeline-Depth \"0\";"
              } > /etc/apt/apt.conf.d/99viperos-retry

              mkdir -p /build && cd /build
              cp -a /src/build/lb-config/. /build/

              # CR entfernen, damit eine unter Windows gespeicherte Datei den
              # Build nicht kippt (ein CR am Zeilenende macht aus "...; do"
              # ein "do\r" und bash bricht ab).
              find /build -type f \( -name "*.hook.chroot" -o -name "*.hook.binary" \
                   -o -name "*.list.chroot" -o -name "*.list.binary" -o -name "config" \
                   -o -name "build" -o -name "clean" \) -exec sed -i "s/\r$//" {} +

              mkdir -p config
              for c in hooks package-lists includes.chroot includes.chroot_before_packages; do
                [ -d "$c" ] || continue
                rm -rf "config/$c"; cp -a "$c" "config/$c"
              done
              find config/hooks -type f -name "*.hook.chroot" -exec chmod 0755 {} + || true
              chmod 0755 auto/config auto/build auto/clean

              lb clean || true
              bash auto/config

              # Exit-Status von lb build erhalten - "| tee" wuerde ihn
              # verschlucken und einen Fehlschlag als Erfolg tarnen.
              set +e
              lb build 2>&1 | tee /build/build.log
              rc=${PIPESTATUS[0]}
              set -e
              if [ "$rc" -ne 0 ]; then
                echo "::error::lb build fehlgeschlagen (rc=$rc)"
                echo "--- letzte 60 Logzeilen ---"
                tail -60 /build/build.log
                exit "$rc"
              fi

              iso=$(find /build -maxdepth 1 -name "*.iso" -print -quit)
              if [ -z "$iso" ]; then
                echo "::error::lb build meldete Erfolg, erzeugte aber keine ISO"
                tail -60 /build/build.log
                exit 1
              fi
              cp "$iso" /output/viperos-1.0-amd64.iso
              cp /build/build.log /output/build.log
              cd /output
              sha256sum viperos-1.0-amd64.iso > viperos-1.0-amd64.iso.sha256
              echo "ISO fertig: $(du -h viperos-1.0-amd64.iso | cut -f1)"
            '

      - name: Verify ISO
        id: result
        run: |
          set -euo pipefail
          ISO=output/viperos-1.0-amd64.iso
          [ -f "$ISO" ] || { echo "::error::ISO fehlt"; exit 1; }

          # Checksumme gegenpruefen, nicht nur erzeugen.
          ( cd output && sha256sum -c viperos-1.0-amd64.iso.sha256 )

          bytes=$(stat -c%s "$ISO")
          mib=$(( bytes / 1024 / 1024 ))
          sha=$(cut -d' ' -f1 output/viperos-1.0-amd64.iso.sha256)

          # Eine ISO unter 700 MB kann kein XFCE-Desktop mit ~1600 Paketen sein.
          if [ "$mib" -lt 700 ]; then
            echo "::error::ISO ist nur ${mib} MB - der Build ist unvollstaendig"; exit 1
          fi
          # Release-Assets sind auf 2 GiB pro Datei begrenzt.
          if [ "$bytes" -gt $((2 * 1024 * 1024 * 1024)) ]; then
            echo "::warning::ISO ist ${mib} MB und ueberschreitet das 2-GiB-Limit fuer Release-Assets"
          fi

          # Bootfaehigkeit pruefen: El-Torito-Katalog und die Partitionstabelle
          # des Hybrid-Images muessen vorhanden sein.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xorriso >/dev/null
          xorriso -indev "$ISO" -report_el_torito plain 2>/dev/null | head -20 || true
          if xorriso -indev "$ISO" -report_el_torito plain 2>/dev/null | grep -qi 'El Torito'; then
            echo "El-Torito-Bootkatalog vorhanden."
          else
            echo "::warning::Kein El-Torito-Bootkatalog gefunden - ISO bootet moeglicherweise nicht"
          fi
          # EFI-Partition (Secure Boot / UEFI-Start)
          if xorriso -indev "$ISO" -report_system_area plain 2>/dev/null | grep -qiE 'gpt|mbr|protective'; then
            echo "Hybrid-Partitionstabelle vorhanden (BIOS + UEFI)."
          fi

          echo "iso-name=viperos-1.0-amd64.iso" >> "$GITHUB_OUTPUT"
          echo "iso-size=${mib} MB"             >> "$GITHUB_OUTPUT"
          echo "iso-sha256=${sha}"              >> "$GITHUB_OUTPUT"

          {
            echo "### ISO gebaut"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Datei | viperos-1.0-amd64.iso |"
            echo "| Groesse | ${mib} MB |"
            echo "| SHA-256 | \`${sha}\` |"
            echo "| Basis | Debian 13 Trixie |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: viperos-iso
          path: |
            output/viperos-1.0-amd64.iso
            output/viperos-1.0-amd64.iso.sha256
          # Hinweis: Der Free-Plan hat nur 500 MB Artifact-Speicher. Eine ~1.8 GB
          # ISO passt dort nicht dauerhaft, daher kurze Aufbewahrung. Fuer
          # dauerhafte Ablage den Workflow mit release=true starten - Releases
          # sind unbegrenzt (max. 2 GiB je Datei).
          retention-days: 5
          compression-level: 0   # ISO ist bereits zstd-komprimiert
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: output/build.log
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Stufe 3: Optionales Release. Nur bei manuellem Start mit release=true.
  # ---------------------------------------------------------------------------
  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # nur dieser Job darf schreiben
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: viperos-iso
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="${{ inputs.version }}"
          [ -z "$VER" ] && VER="1.0-build${{ github.run_number }}"
          TAG="v${VER}"

          # <<-EOF entfernt fuehrende TABS, nicht Leerzeichen. Da YAML mit
          # Leerzeichen einrueckt, wird die Datei zeilenweise geschrieben.
          {
            echo "# ViperOS ${VER}"
            echo ""
            echo "Live-ISO auf Basis von **Debian 13 (Trixie)**, XFCE-Desktop,"
            echo "Calamares-Installer."
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Groesse | ${{ needs.build.outputs.iso-size }} |"
            echo "| SHA-256 | \`${{ needs.build.outputs.iso-sha256 }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo ""
            echo "## Pruefen"
            echo ""
            echo '```'
            echo "sha256sum -c viperos-1.0-amd64.iso.sha256"
            echo '```'
            echo ""
            echo "## Live-Zugang"
            echo ""
            echo "Benutzer \`viperos\`, Passwort \`viperos\` (nur in der Live-Sitzung)."
            echo ""
            echo "> Noch nicht auf echter Hardware verifiziert. Vor dem Verteilen in"
            echo "> einer VM mit UEFI **und** Legacy-BIOS testen."
          } > notes.md

          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "ViperOS ${VER}" \
            --notes-file notes.md \
            dist/viperos-1.0-amd64.iso \
            dist/viperos-1.0-amd64.iso.sha256
